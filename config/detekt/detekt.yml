complexity:
  ComplexCondition:
    active: true
    threshold: 5
  LongParameterList:
    active: true
    # A stateless *ScreenContent takes its state, one callback per action, and a modifier.
    # INSTRUMENTED_TEST_STANDARD section 1 mandates exactly that shape, so counting those
    # parameters as a smell would flag the architecture the repo requires.
    ignoreAnnotated: [ 'Composable' ]

exceptions:
  TooGenericExceptionCaught:
    active: false

naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'

style:
  MaxLineLength:
    active: false
  UnusedPrivateMember:
    active: true
    # @Preview functions are invoked by the Compose tooling, not by code, and PREVIEW_STANDARD
    # makes them mandatory — detekt would otherwise flag every one of them as dead.
    ignoreAnnotated: [ 'Preview', 'PreviewLightDark', 'PreviewScreenSizes' ]
